name: Android APK

# Run from GitHub: Actions -> Android APK -> Run workflow.
# The APK is uploaded as an artifact on the workflow run and is kept for 14 days.
# Nothing runs automatically on pushes.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Run unit tests before building
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  ANDROID_API: "34"
  BUILD_TOOLS: "34.0.0"

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Run unit tests
        if: ${{ inputs.tests == true }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifact
          cp app/build/outputs/apk/debug/app-debug.apk artifact/Spotui-Fixes-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spotui-Fixes-debug
          path: artifact/Spotui-Fixes-debug.apk
          if-no-files-found: error
          retention-days: 14
